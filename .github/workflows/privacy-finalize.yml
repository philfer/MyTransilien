name: Finalize privacy cleanup

on:
  repository_dispatch:
    types:
      - privacy-finalize

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for purge run and delete it
        env:
          GH_TOKEN: ${{ github.token }}
          PURGE_RUN_ID: ${{ github.event.client_payload.purge_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            status=$(curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$PURGE_RUN_ID" \
              | jq -r '.status')
            if [ "$status" = "completed" ]; then
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error --location \
            --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/$PURGE_RUN_ID"

      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Remove finalizer from repository
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/privacy-finalize.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Remove one-time privacy cleanup workflow"
            git push origin main
          fi
